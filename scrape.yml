name: AIS & 通峡予告情報の定期取得

on:
  schedule:
    # 以下はGitHub Actions側の予備トリガー(遅延・スキップが起きやすいため、
    # 実際の定期実行は外部cronサービス(cron-job.org等)からのworkflow_dispatchに任せる想定)
    - cron: "*/5 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "実行するジョブ (ais または tsukou)。空欄なら両方の条件を満たすジョブが動く"
        required: false
        default: ""

jobs:
  ais:
    if: >
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'ais' || github.event.inputs.job == ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scraper_ais.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  tsukou:
    if: >
      github.event.schedule == '0 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'tsukou' || github.event.inputs.job == ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scraper_tsukou.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
