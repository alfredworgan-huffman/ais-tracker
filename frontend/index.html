<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>船舶監視マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 10px 14px; border-radius: 8px;
    font-family: sans-serif; font-size: 14px; max-width: 280px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  #panel h3 { margin: 0 0 6px; font-size: 15px; }
  #geofenceToggle { margin-top: 8px; }
  .ship-label {
    background: rgba(255,255,255,0.85); border: none; box-shadow: none;
    font-size: 11px; padding: 1px 4px; white-space: nowrap;
  }
  .popup-controls { font-size: 13px; }
  .popup-controls select, .popup-controls button {
    font-size: 13px; margin-top: 4px;
  }
  .popup-controls button {
    cursor: pointer; padding: 3px 8px;
  }
  .ship-arrow {
    /* transform-originを中心にして回転させる */
    transform-origin: center center;
  }
  #vesselPanel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: white; padding: 10px 14px; border-radius: 8px;
    font-family: sans-serif; font-size: 13px; max-width: 240px;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  #vesselPanel h3 { margin: 0 0 6px; font-size: 15px; }
  .group-block { margin-bottom: 6px; }
  .group-header, .subgroup-header {
    display: flex; align-items: center; cursor: pointer; user-select: none;
  }
  .group-header { font-weight: bold; }
  .subgroup-header { font-weight: bold; margin-left: 16px; margin-top: 4px; font-size: 12.5px; }
  .collapse-arrow {
    display: inline-block; width: 14px; text-align: center; margin-right: 2px;
  }
  .group-body { margin-left: 4px; }
  .subgroup-body { margin-left: 16px; }
  .vessel-row { margin-left: 16px; display: block; }
  .subgroup-body .vessel-row { margin-left: 16px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="vesselPanel">
  <h3>表示する船</h3>
  <div id="vesselList">読み込み中...</div>
</div>
<div id="panel">
  <h3>登録船監視マップ</h3>
  <div id="status">読み込み中...</div>
  <label id="geofenceToggle">
    <input type="checkbox" id="geofenceCheckbox"> ジオフェンスを表示
  </label>

  <div id="periodPanel" style="margin-top:10px; border-top:1px solid #ddd; padding-top:8px;">
    <div style="font-weight:bold; margin-bottom:4px;">航跡表示期間</div>
    <select id="periodPreset" style="width:100%; font-size:13px;">
      <option value="0,1">直近24時間</option>
      <option value="0,3">直近3日</option>
      <option value="0,7" selected>直近7日</option>
      <option value="7,14">7〜14日前</option>
      <option value="14,30">14〜30日前</option>
      <option value="custom">カスタム(日数を指定)</option>
    </select>
    <div id="customPeriodInputs" style="display:none; margin-top:6px;">
      <input type="number" id="periodFrom" min="0" max="30" value="0" style="width:50px;"> 日前 〜
      <input type="number" id="periodTo" min="0" max="30" value="7" style="width:50px;"> 日前
    </div>
    <button id="applyPeriodBtn" style="margin-top:6px; width:100%; cursor:pointer;">この期間で表示中の船を更新</button>
    <div style="font-size:11px; color:#666; margin-top:4px;">
      ※7日を超える期間は点を間引いて表示します
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ------------------------------------------------------------
// 以下2つをSupabaseプロジェクトの値に書き換えてください
// (anon keyは公開しても問題ない読み取り専用キーです。service_roleキーは絶対に使わないこと)
// ------------------------------------------------------------
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

const map = L.map('map').setView([34.5, 133.5], 7); // 瀬戸内海周辺を初期表示
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};      // mmsi -> Leaflet marker (最新位置、表示中の船のみ存在)
const trackLayers = {};  // mmsi -> Leaflet layerGroup (点+線の航跡、表示中のみ存在)
let geofenceLayer = null;

// 表示ON(チェック済み)の船のMMSI一覧。localStorageに保存して次回開いた時も復元する。
const STORAGE_KEY = 'ais-tracker-shown-mmsis';
function loadShownMmsisFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}
function saveShownMmsisToStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...shownMmsis]));
}
const shownMmsis = loadShownMmsisFromStorage();

// mmsi -> 船情報(name, group_name)。選択パネル構築時に埋める。
const vesselInfo = {};


// 向き(度)に応じて回転した矢印アイコンを作る。
// heading/cogが無い(null)場合は、向きの分からない丸アイコンにフォールバックする。
function buildShipIcon(headingDeg) {
  if (headingDeg === null || headingDeg === undefined) {
    return L.divIcon({
      html: `<div style="width:12px;height:12px;border-radius:50%;background:#1976d2;border:1px solid white;"></div>`,
      className: '', iconSize: [12, 12], iconAnchor: [6, 6]
    });
  }
  const svg = `
    <svg class="ship-arrow" width="24" height="24" viewBox="0 0 24 24"
         style="transform: rotate(${headingDeg}deg);">
      <polygon points="12,2 19,21 12,16 5,21" fill="#1976d2" stroke="white" stroke-width="1"/>
    </svg>`;
  return L.divIcon({
    html: svg, className: '', iconSize: [24, 24], iconAnchor: [12, 12]
  });
}

async function supabaseFetch(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

// UTC文字列を日本時間(JST)の読みやすい表記に変換する
function toJstString(utcString) {
  const d = new Date(utcString);
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }) + ' JST';
}

// 経過日数に応じて赤(期間の最も古い側)〜紫(直近)のグラデーション色を返す
// maxDays: 現在選択されている表示期間の「〜日前」側の値(グラデーションの基準)
function ageToColor(tsString, maxDays) {
  const daysAgo = (Date.now() - new Date(tsString).getTime()) / (24 * 60 * 60 * 1000);
  const span = Math.max(maxDays, 0.01); // 0除算防止
  const clamped = Math.max(0, Math.min(span, daysAgo));
  const hue = (1 - clamped / span) * 270;
  return `hsl(${hue}, 85%, 45%)`;
}

// 現在適用されている航跡表示期間(全船共通・全体メニューで設定)
let currentPeriod = { fromDays: 0, toDays: 7 };


// ポップアップの中身(船名・更新時刻・航跡ON/OFFボタン)を組み立てる
// 表示期間は個別ではなく、画面右上の全体メニューで設定した期間(currentPeriod)を使う
function buildPopupContent(mmsi, name, tsJst) {
  const isShown = !!trackLayers[mmsi];
  return `
    <div class="popup-controls">
      <b>${name}</b><br>
      MMSI: ${mmsi}<br>
      更新: ${tsJst}<br>
      <button id="trackBtn-${mmsi}">${isShown ? '航跡を非表示' : '航跡を表示'}</button>
    </div>
  `;
}

// ポップアップが開かれた時、ボタンにクリックイベントを仕込む
function wirePopupEvents(mmsi, name) {
  const btn = document.getElementById(`trackBtn-${mmsi}`);
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (trackLayers[mmsi]) {
      // 既に表示中なら非表示にする
      map.removeLayer(trackLayers[mmsi]);
      delete trackLayers[mmsi];
      btn.textContent = '航跡を表示';
    } else {
      await loadTrack(mmsi, name);
      btn.textContent = '航跡を非表示';
    }
  });
}

// 折りたたみ状態(グループ/サブグループ単位)。キーは"メイングループ" または "メイングループ>サブグループ"。
// 存在するキーは「折りたたみ中」を意味する。localStorageに保存し、次回開いた時も復元する。
const COLLAPSE_STORAGE_KEY = 'ais-tracker-collapsed-groups';
function loadCollapsedFromStorage() {
  try {
    const raw = localStorage.getItem(COLLAPSE_STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}
function saveCollapsedToStorage() {
  localStorage.setItem(COLLAPSE_STORAGE_KEY, JSON.stringify([...collapsedGroups]));
}
const collapsedGroups = loadCollapsedFromStorage();

// チェックボックスの一覧から、全部ON/一部ON/全部OFFを判定してヘッダーのcheckboxに反映する
function syncHeaderCheckboxState(headerCheckbox, childCheckboxes) {
  const allChecked = childCheckboxes.length > 0 && childCheckboxes.every(cb => cb.checked);
  const noneChecked = childCheckboxes.every(cb => !cb.checked);
  headerCheckbox.checked = allChecked;
  headerCheckbox.indeterminate = !allChecked && !noneChecked;
}

// 船の選択パネルを構築する(メイングループ > サブグループ > 船、の階層構造。折りたたみ対応)
async function buildVesselPanel() {
  const vessels = await supabaseFetch(
    'vessels?select=mmsi,name,group_name,subgroup_name&active=eq.true&order=group_name,subgroup_name,name'
  );
  vessels.forEach(v => { vesselInfo[v.mmsi] = v; });

  // group_name未設定は「未分類」としてまとめる
  const groups = {}; // groupName -> { direct: [...], subgroups: { subgroupName: [...] } }
  vessels.forEach(v => {
    const g = v.group_name || '未分類';
    if (!groups[g]) groups[g] = { direct: [], subgroups: {} };
    if (v.subgroup_name) {
      if (!groups[g].subgroups[v.subgroup_name]) groups[g].subgroups[v.subgroup_name] = [];
      groups[g].subgroups[v.subgroup_name].push(v);
    } else {
      groups[g].direct.push(v);
    }
  });

  const container = document.getElementById('vesselList');
  container.innerHTML = '';

  // 船1隻分のチェックボックス行を作る共通ヘルパー
  function buildVesselRow(v) {
    const row = document.createElement('label');
    row.className = 'vessel-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.mmsi = v.mmsi;
    cb.checked = shownMmsis.has(v.mmsi);
    cb.addEventListener('change', () => toggleVessel(v.mmsi, v.name, cb.checked));
    row.appendChild(cb);
    row.appendChild(document.createTextNode(' ' + v.name));
    return { row, cb };
  }

  Object.keys(groups).sort().forEach(groupName => {
    const groupKey = groupName;
    const groupAllVessels = [...groups[groupName].direct, ...Object.values(groups[groupName].subgroups).flat()];

    const block = document.createElement('div');
    block.className = 'group-block';

    // --- メイングループの見出し ---
    const header = document.createElement('div');
    header.className = 'group-header';
    const arrow = document.createElement('span');
    arrow.className = 'collapse-arrow';
    arrow.textContent = collapsedGroups.has(groupKey) ? '▶' : '▼';
    const groupCheckbox = document.createElement('input');
    groupCheckbox.type = 'checkbox';
    header.appendChild(arrow);
    header.appendChild(groupCheckbox);
    header.appendChild(document.createTextNode(' ' + groupName));
    block.appendChild(header);

    // --- 本体(直下の船 + サブグループ) ---
    const body = document.createElement('div');
    body.className = 'group-body';
    body.style.display = collapsedGroups.has(groupKey) ? 'none' : 'block';

    const allChildCheckboxes = []; // グループ全体の状態判定用(直下+サブグループ全部)

    // メイングループ直下の船(サブグループ無し)
    groups[groupName].direct.forEach(v => {
      const { row, cb } = buildVesselRow(v);
      body.appendChild(row);
      allChildCheckboxes.push(cb);
    });

    // サブグループ
    Object.keys(groups[groupName].subgroups).sort().forEach(subgroupName => {
      const subgroupKey = `${groupName}>${subgroupName}`;
      const subBlock = document.createElement('div');

      const subHeader = document.createElement('div');
      subHeader.className = 'subgroup-header';
      const subArrow = document.createElement('span');
      subArrow.className = 'collapse-arrow';
      subArrow.textContent = collapsedGroups.has(subgroupKey) ? '▶' : '▼';
      const subgroupCheckbox = document.createElement('input');
      subgroupCheckbox.type = 'checkbox';
      subHeader.appendChild(subArrow);
      subHeader.appendChild(subgroupCheckbox);
      subHeader.appendChild(document.createTextNode(' ' + subgroupName));
      subBlock.appendChild(subHeader);

      const subBody = document.createElement('div');
      subBody.className = 'subgroup-body';
      subBody.style.display = collapsedGroups.has(subgroupKey) ? 'none' : 'block';

      const subChildCheckboxes = [];
      groups[groupName].subgroups[subgroupName].forEach(v => {
        const { row, cb } = buildVesselRow(v);
        subBody.appendChild(row);
        subChildCheckboxes.push(cb);
        allChildCheckboxes.push(cb);
      });
      subBlock.appendChild(subBody);
      body.appendChild(subBlock);

      // サブグループ見出し: 折りたたみ(矢印クリック)
      subArrow.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = subBody.style.display === 'none';
        subBody.style.display = isHidden ? 'block' : 'none';
        subArrow.textContent = isHidden ? '▼' : '▶';
        if (isHidden) collapsedGroups.delete(subgroupKey); else collapsedGroups.add(subgroupKey);
        saveCollapsedToStorage();
      });

      // サブグループ見出し: 一括ON/OFF
      subgroupCheckbox.addEventListener('change', () => {
        subChildCheckboxes.forEach(cb => {
          if (cb.checked !== subgroupCheckbox.checked) {
            cb.checked = subgroupCheckbox.checked;
            const mmsi = Number(cb.dataset.mmsi);
            toggleVessel(mmsi, vesselInfo[mmsi].name, cb.checked);
          }
        });
        syncHeaderCheckboxState(groupCheckbox, allChildCheckboxes);
      });

      syncHeaderCheckboxState(subgroupCheckbox, subChildCheckboxes);
    });

    block.appendChild(body);
    container.appendChild(block);

    // メイングループ見出し: 折りたたみ(矢印クリック)
    arrow.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = body.style.display === 'none';
      body.style.display = isHidden ? 'block' : 'none';
      arrow.textContent = isHidden ? '▼' : '▶';
      if (isHidden) collapsedGroups.delete(groupKey); else collapsedGroups.add(groupKey);
      saveCollapsedToStorage();
    });

    // メイングループ見出し: 一括ON/OFF(直下+サブグループすべて対象)
    groupCheckbox.addEventListener('change', () => {
      allChildCheckboxes.forEach(cb => {
        if (cb.checked !== groupCheckbox.checked) {
          cb.checked = groupCheckbox.checked;
          const mmsi = Number(cb.dataset.mmsi);
          toggleVessel(mmsi, vesselInfo[mmsi].name, cb.checked);
        }
      });
      // サブグループ側のヘッダーチェックボックスも合わせて更新
      body.querySelectorAll('.subgroup-header input[type=checkbox]').forEach(subCb => {
        subCb.checked = groupCheckbox.checked;
        subCb.indeterminate = false;
      });
    });

    syncHeaderCheckboxState(groupCheckbox, allChildCheckboxes);
  });

  document.getElementById('status').innerText = `登録: ${vessels.length}隻 / 表示中: ${shownMmsis.size}隻`;

  // 初回表示: 前回チェックしていた船があれば、その最新位置を読み込む
  for (const mmsi of shownMmsis) {
    if (vesselInfo[mmsi]) await refreshVesselMarker(mmsi);
  }
}

// チェックボックスON/OFF時の処理
async function toggleVessel(mmsi, name, checked) {
  if (checked) {
    shownMmsis.add(mmsi);
    await refreshVesselMarker(mmsi);
  } else {
    shownMmsis.delete(mmsi);
    if (markers[mmsi]) { map.removeLayer(markers[mmsi]); delete markers[mmsi]; }
    if (trackLayers[mmsi]) { map.removeLayer(trackLayers[mmsi]); delete trackLayers[mmsi]; }
  }
  saveShownMmsisToStorage();
  document.getElementById('status').innerText = `表示中: ${shownMmsis.size}隻`;
}

// 表示中(チェック済み)の船だけ、最新位置を取得してマーカーを更新/新規作成する
async function refreshVesselMarker(mmsi) {
  const v = vesselInfo[mmsi];
  if (!v) return;

  const rows = await supabaseFetch(
    `positions?mmsi=eq.${mmsi}&order=ts.desc&limit=1&select=lat,lon,ts,heading,cog`
  );
  if (rows.length === 0) return;
  const p = rows[0];
  const tsJst = toJstString(p.ts);
  // TrueHeadingが無ければ対地針路(cog)で代用する(511はAISの「データ無し」の値)
  const headingDeg = (p.heading !== null && p.heading !== 511) ? p.heading : p.cog;

  if (markers[mmsi]) {
    markers[mmsi].setLatLng([p.lat, p.lon]);
    markers[mmsi].setIcon(buildShipIcon(headingDeg));
    markers[mmsi].setPopupContent(buildPopupContent(mmsi, v.name, tsJst));
  } else {
    markers[mmsi] = L.marker([p.lat, p.lon], { icon: buildShipIcon(headingDeg) })
      .addTo(map)
      .bindTooltip(v.name, { permanent: true, direction: 'right', className: 'ship-label' })
      .bindPopup(buildPopupContent(mmsi, v.name, tsJst));

    markers[mmsi].on('popupopen', () => wirePopupEvents(mmsi, v.name));
  }
}

// 表示中(チェック済み)の船だけを対象に、最新位置を一括更新する(5分おきに実行)
async function refreshAllShownMarkers() {
  for (const mmsi of shownMmsis) {
    await refreshVesselMarker(mmsi);
  }
}

// 指定した船の航跡を「点+線」で描画する(全体メニューで選んだ期間・経過日数に応じたグラデーション色)
// vesselNames: mmsi -> name の対応(期間変更時の一括再読み込みで使う)
const vesselNames = {};

async function loadTrack(mmsi, name) {
  vesselNames[mmsi] = name;

  const { fromDays, toDays } = currentPeriod;
  const since = new Date(Date.now() - toDays * 24 * 60 * 60 * 1000).toISOString();
  const until = new Date(Date.now() - fromDays * 24 * 60 * 60 * 1000).toISOString();

  let rows = await supabaseFetch(
    `positions?mmsi=eq.${mmsi}&ts=gte.${since}&ts=lte.${until}&order=ts.asc&select=lat,lon,ts`
  );

  // 7日を超える期間は、点が多くなりすぎて煩雑になるため間引く
  // (最大300点程度になるよう均等にスキップする簡易的な間引き)
  const periodSpanDays = toDays - fromDays;
  if (periodSpanDays > 7 && rows.length > 300) {
    const step = Math.ceil(rows.length / 300);
    rows = rows.filter((_, i) => i % step === 0);
  }

  if (rows.length === 0) {
    document.getElementById('status').innerText = `${name}: 指定期間の航跡データがありません`;
    // 既存のレイヤーがあれば消しておく(期間変更で0件になった場合)
    if (trackLayers[mmsi]) { map.removeLayer(trackLayers[mmsi]); delete trackLayers[mmsi]; }
    return;
  }

  // 既に表示中なら一旦消してから描き直す(期間変更時の更新用)
  if (trackLayers[mmsi]) { map.removeLayer(trackLayers[mmsi]); delete trackLayers[mmsi]; }

  const group = L.layerGroup();
  const maxDaysForColor = Math.max(toDays, 0.5);

  // 線: 2点間ごとに短い線分として描画し、それぞれ新しい方の点の時刻で色付けする
  // (Leafletの1本のpolylineは単色しか指定できないため、区間ごとに分割している)
  for (let i = 1; i < rows.length; i++) {
    const prev = rows[i - 1];
    const curr = rows[i];
    L.polyline([[prev.lat, prev.lon], [curr.lat, curr.lon]], {
      color: ageToColor(curr.ts, maxDaysForColor), weight: 3
    }).addTo(group);
  }

  // 点: 各取得ポイントをその時刻の色で描画
  rows.forEach(r => {
    L.circleMarker([r.lat, r.lon], {
      radius: 3, color: ageToColor(r.ts, maxDaysForColor), fillColor: ageToColor(r.ts, maxDaysForColor), fillOpacity: 0.9
    })
      .bindTooltip(toJstString(r.ts))
      .addTo(group);
  });

  group.addTo(map);
  trackLayers[mmsi] = group;

  document.getElementById('status').innerText =
    `${name} の航跡 (${rows.length}点, ${fromDays}〜${toDays}日前)`;
}

// --- 全体メニュー: 航跡表示期間の操作 ---

function applyPresetToInputs(value) {
  if (value === 'custom') {
    document.getElementById('customPeriodInputs').style.display = 'block';
    return;
  }
  document.getElementById('customPeriodInputs').style.display = 'none';
  const [from, to] = value.split(',').map(Number);
  document.getElementById('periodFrom').value = from;
  document.getElementById('periodTo').value = to;
}

document.getElementById('periodPreset').addEventListener('change', (e) => {
  applyPresetToInputs(e.target.value);
});

// 「この期間で表示中の船を更新」ボタン: 現在表示中(ONになっている)船を、新しい期間で描き直す
document.getElementById('applyPeriodBtn').addEventListener('click', async () => {
  const fromDays = Number(document.getElementById('periodFrom').value);
  const toDays = Number(document.getElementById('periodTo').value);
  if (fromDays >= toDays) {
    document.getElementById('status').innerText = '「〜日前」は開始日数より大きい値にしてください';
    return;
  }
  currentPeriod = { fromDays, toDays };

  const mmsisToRefresh = Object.keys(trackLayers).map(Number);
  if (mmsisToRefresh.length === 0) {
    document.getElementById('status').innerText = '航跡を表示中の船がありません(先にマーカーをクリックして表示してください)';
    return;
  }
  for (const mmsi of mmsisToRefresh) {
    await loadTrack(mmsi, vesselNames[mmsi] || String(mmsi));
  }
});

// ジオフェンスの表示/非表示
document.getElementById('geofenceCheckbox').addEventListener('change', async (e) => {
  if (e.target.checked) {
    await loadGeofences();
  } else if (geofenceLayer) {
    map.removeLayer(geofenceLayer);
    geofenceLayer = null;
  }
});

async function loadGeofences() {
  // geofences.polygon は geography(Polygon) 型。PostgRESTはデフォルトでGeoJSON文字列を返さないため、
  // Supabase側に以下のビューを1度だけ作成しておくと簡単に取得できます:
  //
  //   create or replace view geofences_geojson as
  //   select id, name, st_asgeojson(polygon)::json as geojson
  //   from geofences where active = true;
  //
  const rows = await supabaseFetch('geofences_geojson?select=id,name,geojson');
  geofenceLayer = L.layerGroup();
  rows.forEach(r => {
    L.geoJSON(r.geojson, { style: { color: 'red', weight: 2, fillOpacity: 0.1 } })
      .bindTooltip(r.name)
      .addTo(geofenceLayer);
  });
  geofenceLayer.addTo(map);
}

buildVesselPanel();
setInterval(refreshAllShownMarkers, 5 * 60 * 1000); // 5分おきに「表示中の船だけ」最新位置を更新
</script>
