<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>船舶監視マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 10px 14px; border-radius: 8px;
    font-family: sans-serif; font-size: 14px; max-width: 280px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  #panel h3 { margin: 0 0 6px; font-size: 15px; }
  #geofenceToggle { margin-top: 8px; }
  .ship-label {
    background: rgba(255,255,255,0.85); border: none; box-shadow: none;
    font-size: 11px; padding: 1px 4px; white-space: nowrap;
  }
  .popup-controls { font-size: 13px; }
  .popup-controls select, .popup-controls button {
    font-size: 13px; margin-top: 4px;
  }
  .popup-controls button {
    cursor: pointer; padding: 3px 8px;
  }
  .ship-arrow {
    /* transform-originを中心にして回転させる */
    transform-origin: center center;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="panel">
  <h3>登録船監視マップ</h3>
  <div id="status">読み込み中...</div>
  <label id="geofenceToggle">
    <input type="checkbox" id="geofenceCheckbox"> ジオフェンスを表示
  </label>

  <div id="periodPanel" style="margin-top:10px; border-top:1px solid #ddd; padding-top:8px;">
    <div style="font-weight:bold; margin-bottom:4px;">航跡表示期間</div>
    <select id="periodPreset" style="width:100%; font-size:13px;">
      <option value="0,1">直近24時間</option>
      <option value="0,3">直近3日</option>
      <option value="0,7" selected>直近7日</option>
      <option value="7,14">7〜14日前</option>
      <option value="14,30">14〜30日前</option>
      <option value="custom">カスタム(日数を指定)</option>
    </select>
    <div id="customPeriodInputs" style="display:none; margin-top:6px;">
      <input type="number" id="periodFrom" min="0" max="30" value="0" style="width:50px;"> 日前 〜
      <input type="number" id="periodTo" min="0" max="30" value="7" style="width:50px;"> 日前
    </div>
    <button id="applyPeriodBtn" style="margin-top:6px; width:100%; cursor:pointer;">この期間で表示中の船を更新</button>
    <div style="font-size:11px; color:#666; margin-top:4px;">
      ※7日を超える期間は点を間引いて表示します
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ------------------------------------------------------------
// 以下2つをSupabaseプロジェクトの値に書き換えてください
// (anon keyは公開しても問題ない読み取り専用キーです。service_roleキーは絶対に使わないこと)
// ------------------------------------------------------------
const SUPABASE_URL = "https://xzkvlsgkciwjkrlqzcmm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_oSHH1EM145MzI-DiDIKndw_3PYkmDly";

const map = L.map('map').setView([34.5, 133.5], 7); // 瀬戸内海周辺を初期表示
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};      // mmsi -> Leaflet marker (最新位置)
const trackLayers = {};  // mmsi -> Leaflet layerGroup (点+線の航跡、表示中のみ存在)
let geofenceLayer = null;

// 向き(度)に応じて回転した矢印アイコンを作る。
// heading/cogが無い(null)場合は、向きの分からない丸アイコンにフォールバックする。
function buildShipIcon(headingDeg) {
  if (headingDeg === null || headingDeg === undefined) {
    return L.divIcon({
      html: `<div style="width:12px;height:12px;border-radius:50%;background:#1976d2;border:1px solid white;"></div>`,
      className: '', iconSize: [12, 12], iconAnchor: [6, 6]
    });
  }
  const svg = `
    <svg class="ship-arrow" width="24" height="24" viewBox="0 0 24 24"
         style="transform: rotate(${headingDeg}deg);">
      <polygon points="12,2 19,21 12,16 5,21" fill="#1976d2" stroke="white" stroke-width="1"/>
    </svg>`;
  return L.divIcon({
    html: svg, className: '', iconSize: [24, 24], iconAnchor: [12, 12]
  });
}

async function supabaseFetch(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

// UTC文字列を日本時間(JST)の読みやすい表記に変換する
function toJstString(utcString) {
  const d = new Date(utcString);
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }) + ' JST';
}

// 経過日数に応じて赤(期間の最も古い側)〜紫(直近)のグラデーション色を返す
// maxDays: 現在選択されている表示期間の「〜日前」側の値(グラデーションの基準)
function ageToColor(tsString, maxDays) {
  const daysAgo = (Date.now() - new Date(tsString).getTime()) / (24 * 60 * 60 * 1000);
  const span = Math.max(maxDays, 0.01); // 0除算防止
  const clamped = Math.max(0, Math.min(span, daysAgo));
  const hue = (1 - clamped / span) * 270;
  return `hsl(${hue}, 85%, 45%)`;
}

// 現在適用されている航跡表示期間(全船共通・全体メニューで設定)
let currentPeriod = { fromDays: 0, toDays: 7 };


// ポップアップの中身(船名・更新時刻・航跡ON/OFFボタン)を組み立てる
// 表示期間は個別ではなく、画面右上の全体メニューで設定した期間(currentPeriod)を使う
function buildPopupContent(mmsi, name, tsJst) {
  const isShown = !!trackLayers[mmsi];
  return `
    <div class="popup-controls">
      <b>${name}</b><br>
      MMSI: ${mmsi}<br>
      更新: ${tsJst}<br>
      <button id="trackBtn-${mmsi}">${isShown ? '航跡を非表示' : '航跡を表示'}</button>
    </div>
  `;
}

// ポップアップが開かれた時、ボタンにクリックイベントを仕込む
function wirePopupEvents(mmsi, name) {
  const btn = document.getElementById(`trackBtn-${mmsi}`);
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (trackLayers[mmsi]) {
      // 既に表示中なら非表示にする
      map.removeLayer(trackLayers[mmsi]);
      delete trackLayers[mmsi];
      btn.textContent = '航跡を表示';
    } else {
      await loadTrack(mmsi, name);
      btn.textContent = '航跡を非表示';
    }
  });
}

// 各船の最新位置だけを取得して表示する(常時ラベル付き)
async function loadLatestPositions() {
  const vessels = await supabaseFetch('vessels?select=mmsi,name&active=eq.true');
  document.getElementById('status').innerText = `監視中: ${vessels.length}隻`;

  for (const v of vessels) {
    const rows = await supabaseFetch(
      `positions?mmsi=eq.${v.mmsi}&order=ts.desc&limit=1&select=lat,lon,ts,heading,cog`
    );
    if (rows.length === 0) continue;
    const p = rows[0];
    const tsJst = toJstString(p.ts);
    // TrueHeadingが無ければ対地針路(cog)で代用する(511はAISの「データ無し」の値)
    const headingDeg = (p.heading !== null && p.heading !== 511) ? p.heading : p.cog;

    if (markers[v.mmsi]) {
      markers[v.mmsi].setLatLng([p.lat, p.lon]);
      markers[v.mmsi].setIcon(buildShipIcon(headingDeg));
      markers[v.mmsi].setPopupContent(buildPopupContent(v.mmsi, v.name, tsJst));
    } else {
      markers[v.mmsi] = L.marker([p.lat, p.lon], { icon: buildShipIcon(headingDeg) })
        .addTo(map)
        .bindTooltip(v.name, { permanent: true, direction: 'right', className: 'ship-label' })
        .bindPopup(buildPopupContent(v.mmsi, v.name, tsJst));

      markers[v.mmsi].on('popupopen', () => wirePopupEvents(v.mmsi, v.name));
    }
  }
}

// 指定した船の航跡を「点+線」で描画する(全体メニューで選んだ期間・経過日数に応じたグラデーション色)
// vesselNames: mmsi -> name の対応(期間変更時の一括再読み込みで使う)
const vesselNames = {};

async function loadTrack(mmsi, name) {
  vesselNames[mmsi] = name;

  const { fromDays, toDays } = currentPeriod;
  const since = new Date(Date.now() - toDays * 24 * 60 * 60 * 1000).toISOString();
  const until = new Date(Date.now() - fromDays * 24 * 60 * 60 * 1000).toISOString();

  let rows = await supabaseFetch(
    `positions?mmsi=eq.${mmsi}&ts=gte.${since}&ts=lte.${until}&order=ts.asc&select=lat,lon,ts`
  );

  // 7日を超える期間は、点が多くなりすぎて煩雑になるため間引く
  // (最大300点程度になるよう均等にスキップする簡易的な間引き)
  const periodSpanDays = toDays - fromDays;
  if (periodSpanDays > 7 && rows.length > 300) {
    const step = Math.ceil(rows.length / 300);
    rows = rows.filter((_, i) => i % step === 0);
  }

  if (rows.length === 0) {
    document.getElementById('status').innerText = `${name}: 指定期間の航跡データがありません`;
    // 既存のレイヤーがあれば消しておく(期間変更で0件になった場合)
    if (trackLayers[mmsi]) { map.removeLayer(trackLayers[mmsi]); delete trackLayers[mmsi]; }
    return;
  }

  // 既に表示中なら一旦消してから描き直す(期間変更時の更新用)
  if (trackLayers[mmsi]) { map.removeLayer(trackLayers[mmsi]); delete trackLayers[mmsi]; }

  const group = L.layerGroup();
  const maxDaysForColor = Math.max(toDays, 0.5);

  // 線: 2点間ごとに短い線分として描画し、それぞれ新しい方の点の時刻で色付けする
  // (Leafletの1本のpolylineは単色しか指定できないため、区間ごとに分割している)
  for (let i = 1; i < rows.length; i++) {
    const prev = rows[i - 1];
    const curr = rows[i];
    L.polyline([[prev.lat, prev.lon], [curr.lat, curr.lon]], {
      color: ageToColor(curr.ts, maxDaysForColor), weight: 3
    }).addTo(group);
  }

  // 点: 各取得ポイントをその時刻の色で描画
  rows.forEach(r => {
    L.circleMarker([r.lat, r.lon], {
      radius: 3, color: ageToColor(r.ts, maxDaysForColor), fillColor: ageToColor(r.ts, maxDaysForColor), fillOpacity: 0.9
    })
      .bindTooltip(toJstString(r.ts))
      .addTo(group);
  });

  group.addTo(map);
  trackLayers[mmsi] = group;

  document.getElementById('status').innerText =
    `${name} の航跡 (${rows.length}点, ${fromDays}〜${toDays}日前)`;
}

// --- 全体メニュー: 航跡表示期間の操作 ---

function applyPresetToInputs(value) {
  if (value === 'custom') {
    document.getElementById('customPeriodInputs').style.display = 'block';
    return;
  }
  document.getElementById('customPeriodInputs').style.display = 'none';
  const [from, to] = value.split(',').map(Number);
  document.getElementById('periodFrom').value = from;
  document.getElementById('periodTo').value = to;
}

document.getElementById('periodPreset').addEventListener('change', (e) => {
  applyPresetToInputs(e.target.value);
});

// 「この期間で表示中の船を更新」ボタン: 現在表示中(ONになっている)船を、新しい期間で描き直す
document.getElementById('applyPeriodBtn').addEventListener('click', async () => {
  const fromDays = Number(document.getElementById('periodFrom').value);
  const toDays = Number(document.getElementById('periodTo').value);
  if (fromDays >= toDays) {
    document.getElementById('status').innerText = '「〜日前」は開始日数より大きい値にしてください';
    return;
  }
  currentPeriod = { fromDays, toDays };

  const mmsisToRefresh = Object.keys(trackLayers).map(Number);
  if (mmsisToRefresh.length === 0) {
    document.getElementById('status').innerText = '航跡を表示中の船がありません(先にマーカーをクリックして表示してください)';
    return;
  }
  for (const mmsi of mmsisToRefresh) {
    await loadTrack(mmsi, vesselNames[mmsi] || String(mmsi));
  }
});

// ジオフェンスの表示/非表示
document.getElementById('geofenceCheckbox').addEventListener('change', async (e) => {
  if (e.target.checked) {
    await loadGeofences();
  } else if (geofenceLayer) {
    map.removeLayer(geofenceLayer);
    geofenceLayer = null;
  }
});

async function loadGeofences() {
  // geofences.polygon は geography(Polygon) 型。PostgRESTはデフォルトでGeoJSON文字列を返さないため、
  // Supabase側に以下のビューを1度だけ作成しておくと簡単に取得できます:
  //
  //   create or replace view geofences_geojson as
  //   select id, name, st_asgeojson(polygon)::json as geojson
  //   from geofences where active = true;
  //
  const rows = await supabaseFetch('geofences_geojson?select=id,name,geojson');
  geofenceLayer = L.layerGroup();
  rows.forEach(r => {
    L.geoJSON(r.geojson, { style: { color: 'red', weight: 2, fillOpacity: 0.1 } })
      .bindTooltip(r.name)
      .addTo(geofenceLayer);
  });
  geofenceLayer.addTo(map);
}

loadLatestPositions();
setInterval(loadLatestPositions, 5 * 60 * 1000); // 5分おきに最新位置を更新
</script>

</body>
</html>
